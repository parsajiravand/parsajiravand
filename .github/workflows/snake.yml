name: Contribution snake

# Animates the contribution graph as a snake and pushes both SVGs to the
# `output` branch, which the README reads via raw.githubusercontent.com.
# Self-contained: no third-party service is involved at render time.

on:
  schedule:
    # Every 12 hours, so the animation tracks recent commits.
    - cron: "0 */12 * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3.5.0
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
