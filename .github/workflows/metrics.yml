name: GitHub metrics

# Renders assets/metrics.svg inside this repo and commits it.
# This replaces the old github-readme-stats.vercel.app cards, which went down
# (503 DEPLOYMENT_PAUSED) and took the stats + top-languages images with them.
# Because the SVG lives in the repo, nothing external has to stay up for the
# README to render.

on:
  schedule:
    # Every day at 04:00 UTC.
    - cron: "0 4 * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@v3.34
        with:
          # METRICS_TOKEN is a classic PAT with the `public_repo` scope. It is
          # optional: without it this falls back to GITHUB_TOKEN, which renders
          # public-repo stats fine but cannot see private contributions.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: parsajiravand
          filename: assets/metrics.svg
          template: classic
          config_timezone: UTC
          config_display: large

          # Deliberately limited to what a repo-scoped GITHUB_TOKEN can actually
          # see. `repositories` is excluded because the token only has visibility
          # into this one repo, so it rendered "1 Repository / 0 Releases /
          # 14 kB used" for an account with 40 public repos. The languages and
          # habits plugins fail the same way ("0 Languages", "Unexpected error"),
          # so languages are rendered by scripts/render-language-card.mjs from
          # the public API instead.
          #
          # Adding a METRICS_TOKEN secret (classic PAT, `public_repo` scope)
          # would make those safe to re-enable, and would include private
          # contributions in the counts.
          base: header, activity, community, metadata
