name: Latest dev.to posts

# Pulls the dev.to RSS feed and rewrites the block between the
# BLOG-POST-LIST markers in README.md, then commits the change.
# Given a post goes out daily, this keeps the profile current without edits.

on:
  schedule:
    # 09:30 UTC — after the daily publish window.
    - cron: "30 9 * * *"
  push:
    # So the list fills in on the first push instead of sitting empty until the
    # next scheduled run. Commits made with GITHUB_TOKEN do not trigger
    # workflows, so this cannot loop on the action's own README commit.
    branches: [master]
    paths:
      - .github/workflows/blog-posts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/parsajiravand"
          max_post_count: 6
          template: "- [$title]($url) &nbsp;<sub>$date</sub>$newline"
          date_format: "mmm d, yyyy"
          commit_message: "chore: refresh latest dev.to posts"
