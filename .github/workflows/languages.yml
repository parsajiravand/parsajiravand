name: Language card

# Renders the "most used languages" card from the public GitHub API and commits
# it. Replaces the dead github-readme-stats top-langs image without depending on
# anyone else's hosting, and without needing a personal access token: the
# repo-scoped GITHUB_TOKEN is only used to lift the API rate limit.

on:
  schedule:
    # Every day at 05:00 UTC, an hour after the metrics job.
    - cron: "0 5 * * *"
  push:
    branches: [master]
    paths:
      - scripts/render-language-card.mjs
      - .github/workflows/languages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render language card
        run: node scripts/render-language-card.mjs
        env:
          # Raises the limit from 60 to 5000 requests/hour. The script aborts
          # rather than publishing a card built from partial data.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg assets/languages-dark.svg
          git diff --quiet --cached || git commit -m "chore: refresh language card"
          git push
